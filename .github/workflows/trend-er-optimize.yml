name: Trend following - efficiency-ratio-only entry, sequential optimization on 51 markets (development years only)
# trend_er_optimize.py: efficiency ratio target, then initial stop, trailing stop, time stop. 44 markets plus 7 European/short-rate markets.
# Sealed years (2021-11-08 on) are cut at load inside trend_er_optimize.py.
on:
  workflow_dispatch:
  push:
    branches: ['claude/trend-universe-contract-size-20261112']
    paths:
      - 'research/trend_following/portfolio_51_list.csv'
      - 'research/trend_following/trend_er_optimize.py'
      - '.github/workflows/trend-er-optimize.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Efficiency ratio optimization on 51 markets, development years only
        run: |
          mkdir -p research/trend_following/results_v6
          python research/trend_following/trend_er_optimize.py futures_prices.parquet futures_data/trend_universe.csv research/trend_following/portfolio_51_list.csv research/trend_following/results_v6 research/trend_following/portfolio_44_list.csv | tee research/trend_following/results_v6/optimize_output.txt
          for ER in 055 060; do
            mkdir -p research/trend_following/results_v7_er$ER
            FORCE_ER=0.${ER#0} python research/trend_following/trend_er_optimize.py futures_prices.parquet futures_data/trend_universe.csv research/trend_following/portfolio_51_list.csv research/trend_following/results_v7_er$ER research/trend_following/portfolio_44_list.csv | tee research/trend_following/results_v7_er$ER/optimize_output.txt
          done
      - name: Save results on the branch
        run: |
          echo "workflow run ${{ github.run_id }}" > research/trend_following/results_v6/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following/results_v6 research/trend_following/results_v7_er055 research/trend_following/results_v7_er060
          git commit -m "44-market portfolio baseline results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
