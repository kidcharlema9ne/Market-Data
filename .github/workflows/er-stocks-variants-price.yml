name: "Efficiency ratio rule on stocks, variants (price): in-sample"
# research/trend_following_stocks/er_stocks_variants.py (Michael, 17 Nov 2026). In-sample only (data through 2021-08-06); later years are never read.
on:
  workflow_dispatch:
  push:
    branches: ['claude/er-stocks-20261117']
    paths:
      - 'research/trend_following_stocks/er_stocks_variants.py'
      - 'research/trend_following_stocks/fetch_stock_prices.py'
      - 'research/trend_following_stocks/er_stocks.py'
      - 'research/trend_following_stocks/er_stocks_common_momentum.py'
      - 'research/trend_following_stocks/er_stocks_market_band.py'
      - '.github/workflows/er-stocks-variants-price.yml'
concurrency:
  group: er-stocks-variants-price
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch stock and SPY prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_stock_prices.py data_stocks
      - name: price
        if: always()
        run: |
          mkdir -p research/trend_following_stocks/results_variants_price
          python research/trend_following_stocks/er_stocks_variants.py data_stocks/stock_prices.parquet research/trend_following_stocks/results_variants_price data_stocks/spy_prices.parquet price | tee research/trend_following_stocks/results_variants_price/output_price.txt
      - name: floor10
        if: always()
        run: |
          mkdir -p research/trend_following_stocks/results_variants_price
          python research/trend_following_stocks/er_stocks_variants.py data_stocks/stock_prices.parquet research/trend_following_stocks/results_variants_price data_stocks/spy_prices.parquet floor10 | tee research/trend_following_stocks/results_variants_price/output_floor10.txt
      - name: floor25
        if: always()
        run: |
          mkdir -p research/trend_following_stocks/results_variants_price
          python research/trend_following_stocks/er_stocks_variants.py data_stocks/stock_prices.parquet research/trend_following_stocks/results_variants_price data_stocks/spy_prices.parquet floor25 | tee research/trend_following_stocks/results_variants_price/output_floor25.txt
      - name: floor50
        if: always()
        run: |
          mkdir -p research/trend_following_stocks/results_variants_price
          python research/trend_following_stocks/er_stocks_variants.py data_stocks/stock_prices.parquet research/trend_following_stocks/results_variants_price data_stocks/spy_prices.parquet floor50 | tee research/trend_following_stocks/results_variants_price/output_floor50.txt
      - name: Save results on the branch
        if: always()
        run: |
          echo "workflow run ${{ github.run_id }}" > research/trend_following_stocks/results_variants_price/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following_stocks/results_variants_price
          git commit -m "Variants price, in-sample results_variants_price (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
