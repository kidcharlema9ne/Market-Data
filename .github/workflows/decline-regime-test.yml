name: Decline and SPY regime noise check
on:
  workflow_dispatch:
  push:
    paths:
      - 'decline_regime_test.py'
      - '.github/workflows/decline-regime-test.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow exchange-calendars
      - name: Decline band and regime study (read-only, prints to log)
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
        run: python -u decline_regime_test.py
