name: "Trend system 4 ATR initial and 5 ATR trailing stop, correlation with COT gap system"
# er_four_atr_corr.py. Declared in the script header before the run.
on:
  workflow_dispatch:
  push:
    branches: ['claude/trend-4atr-cot-corr-20261121']
    paths:
      - 'research/trend_following/er_four_atr_corr.py'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Trend 4 ATR run and correlation
        run: |
          mkdir -p research/trend_following/results_four_atr_corr
          python research/trend_following/er_four_atr_corr.py futures_prices.parquet futures_data/report_universe_48_markets.csv research/trend_following/results_four_atr_corr research/trend_following/cot_input/cot_gap_daily_returns.csv | tee research/trend_following/results_four_atr_corr/output.txt
      - name: Save results on the branch
        run: |
          echo "workflow run ${{ github.run_id }}" > research/trend_following/results_four_atr_corr/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following/results_four_atr_corr
          git commit -m "Trend 4 ATR and COT correlation results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
