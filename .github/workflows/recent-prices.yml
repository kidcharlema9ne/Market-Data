name: Recent prices for other repos (futures + ETF stand-ins)

# Writes two small files into THIS public repo so other repos (the COT System, the trend following system) can read prices
# by cloning it, with no keys of their own:
#   prices/futures_recent.csv.gz  last ~700 days of the 48+ markets, roll-adjusted, from the stitched table in R2
#   prices/etf_recent.csv.gz      ETF stand-ins, from Yahoo, then Stooq, then Nasdaq.com, then the MarketParquet copy in R2
# The stitched futures table itself is rebuilt by futures-current-build.yml; this job only exports its newest copy.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_run:
    workflows: ['Build current futures series (Yahoo gap fill + vendor free days) into a separate R2 prefix']
    types: [completed]
permissions:
  contents: write
concurrency: recent-prices
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas
      - name: Export recent futures (keeps the old file if the table cannot be read)
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/export_recent_futures.py
      - name: Fetch ETF stand-ins (never fails the run)
        continue-on-error: true
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_etf_prices.py
      - name: Commit the two files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add prices/futures_recent.csv.gz prices/etf_recent.csv.gz
          git diff --cached --quiet || git commit -m "Recent prices refresh"
          git pull -q --rebase origin "$GITHUB_REF_NAME" || true
          git push
