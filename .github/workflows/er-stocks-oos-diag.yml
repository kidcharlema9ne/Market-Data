name: "Stocks: out-of-sample diagnostics (data artifacts check, trade quality by year)"
# research/trend_following_stocks/er_stocks_oos_diagnostics.py (diagnostics of the Entry 171 sealed run; changes no rule).
on:
  push:
    branches: [claude/stocks-oos-20261119]
    paths: ['.github/workflows/er-stocks-oos-diag.yml']
  workflow_dispatch:
concurrency:
  group: er-stocks-oos-diag-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch stock and SPY prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_stock_prices.py data_stocks
      - name: Run
        run: |
          D=research/trend_following_stocks/results_oos_diagnostics
          mkdir -p $D
          python research/trend_following_stocks/er_stocks_oos_diagnostics.py data_stocks/stock_prices.parquet $D data_stocks/spy_prices.parquet | tee $D/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          D=research/trend_following_stocks/results_oos_diagnostics
          echo "workflow run ${{ github.run_id }}" > $D/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $D
          git commit -m "Stocks out-of-sample diagnostics (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
