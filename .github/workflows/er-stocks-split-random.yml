name: "Efficiency ratio rule on stocks, split random baseline: in-sample"
# research/trend_following_stocks/er_stocks_split_random.py (Michael, 17 Nov 2026). In-sample only (data through 2021-08-06); later years are never read.
on:
  workflow_dispatch:
  push:
    branches: ['claude/er-stocks-20261117']
    paths:
      - 'research/trend_following_stocks/er_stocks_split_random.py'
      - '.github/workflows/er-stocks-split-random.yml'
concurrency:
  group: er-stocks-split-random-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {top: '0.20', spy: 'on',  tag: strong_spy}
          - {top: '0.20', spy: 'off', tag: strong_nospy}
          - {top: '1.0',  spy: 'on',  tag: all_spy}
          - {top: '1.0',  spy: 'off', tag: all_nospy}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch stock and SPY prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_stock_prices.py data_stocks
      - name: Split random baseline
        run: |
          D=research/trend_following_stocks/results_split_random_${{ matrix.tag }}
          mkdir -p $D
          python research/trend_following_stocks/er_stocks_split_random.py data_stocks/stock_prices.parquet $D data_stocks/spy_prices.parquet ${{ matrix.top }} ${{ matrix.spy }} 30 | tee $D/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          D=research/trend_following_stocks/results_split_random_${{ matrix.tag }}
          echo "workflow run ${{ github.run_id }}" > $D/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $D
          git commit -m "Split random baseline (${{ matrix.tag }}), in-sample (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
