name: MarketParquet full daily archive to R2
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'JSON list of years to transfer (default 2000-2026)'
        required: false
        default: '[2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]'
permissions:
  contents: read
jobs:
  plan-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the API key sees the full archive
        env:
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
        run: |
          set -e
          test -n "$MARKETPARQUET_API_KEY" || { echo "MARKETPARQUET_API_KEY is missing"; exit 1; }
          curl -fsS -H "Authorization: Bearer $MARKETPARQUET_API_KEY" https://marketparquet.com/api/v1/assets | head -c 3000; echo
          for a in stock_daily etf_daily; do
            echo "== $a 2008 manifest (full-history check)"
            curl -fsS -H "Authorization: Bearer $MARKETPARQUET_API_KEY" "https://marketparquet.com/api/v1/manifest/$a?start=2008-09-01&end=2008-09-30" | python3 -c "import json,sys; m=json.load(sys.stdin); print('plan=',m.get('plan'),'files=',len(m.get('files') or []))"
          done
  transfer:
    needs: plan-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        asset: [stock_daily, etf_daily]
        year: ${{ fromJSON(inputs.years) }}
    concurrency:
      group: mp-${{ matrix.asset }}-${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow
      - name: Transfer and verify ${{ matrix.asset }} ${{ matrix.year }}
        env:
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python marketparquet_archive_transfer.py "${{ matrix.asset }}" "${{ matrix.year }}"
