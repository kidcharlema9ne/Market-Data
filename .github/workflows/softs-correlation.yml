name: Trend following - London cocoa and Robusta correlation with US markets
# Descriptive only. Runs by hand, or on a push to this branch that changes the script or this file.
on:
  workflow_dispatch:
  push:
    branches: ['claude/trend-universe-contract-size-20261112']
    paths:
      - 'research/trend_following/softs_correlation.py'
      - '.github/workflows/softs-correlation.yml'
permissions:
  contents: write
jobs:
  corr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Correlations
        run: |
          mkdir -p research/trend_following/results
          python research/trend_following/softs_correlation.py futures_prices.parquet futures_data/trend_universe.csv research/trend_following/results | tee research/trend_following/results/softs_correlation_output.txt
      - name: Save results on the branch
        run: |
          echo "workflow run ${{ github.run_id }}" > research/trend_following/results/SOFTS_RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following/results
          git commit -m "Softs correlation results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
