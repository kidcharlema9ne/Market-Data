name: "Efficiency ratio rule on stocks, many ideas (entry, exit, account, structure, sector), each alone: in-sample"
# research/trend_following_stocks/er_stocks_many_ideas.py (Michael, 18 Nov 2026). In-sample only (data through 2021-08-06); later years are never read.
on:
  workflow_dispatch:
  push:
    branches: ['claude/er-stocks-20261117']
    paths:
      - 'research/trend_following_stocks/er_stocks_many_ideas.py'
      - 'research/trend_following_stocks/fetch_sector_etfs.py'
      - '.github/workflows/er-stocks-many-ideas.yml'
concurrency:
  group: er-stocks-many-ideas-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        mode: [entry, exit, account, structure, sector]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch stock and SPY prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_stock_prices.py data_stocks
      - name: Fetch sector ETFs from R2
        if: matrix.mode == 'sector'
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_sector_etfs.py data_stocks
      - name: Idea test (${{ matrix.mode }})
        run: |
          D=research/trend_following_stocks/results_many_${{ matrix.mode }}
          mkdir -p $D
          python research/trend_following_stocks/er_stocks_many_ideas.py data_stocks/stock_prices.parquet $D data_stocks/spy_prices.parquet ${{ matrix.mode }} data_stocks/sector_etfs.parquet | tee $D/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          D=research/trend_following_stocks/results_many_${{ matrix.mode }}
          echo "workflow run ${{ github.run_id }}" > $D/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $D
          git commit -m "Many ideas (${{ matrix.mode }}), in-sample (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
