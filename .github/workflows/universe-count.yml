name: "Stock universe count by year and symbol type (in-sample only)"
# research/trend_following_stocks/universe_count.py (Michael, 17 Nov 2026). Counts only; files after 2021-08-06 are never opened.
on:
  workflow_dispatch:
  push:
    branches: ['claude/universe-count-20261117']
    paths:
      - 'research/trend_following_stocks/universe_count.py'
      - '.github/workflows/universe-count.yml'
concurrency:
  group: universe-count
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Count universe
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p research/trend_following_stocks/results_universe_count
          python research/trend_following_stocks/universe_count.py research/trend_following_stocks/results_universe_count
      - name: Save results on the branch
        if: always()
        run: |
          echo "workflow run ${{ github.run_id }}" > research/trend_following_stocks/results_universe_count/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following_stocks/results_universe_count
          git commit -m "Universe count, in-sample (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
