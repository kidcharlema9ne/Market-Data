name: WTI inventory-release five-minute CL bars
on:
  push:
    branches: [research/cot-futures-r2-audit]
    paths: [wti_release_bars.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyarrow boto3
      - name: Extract CL for the historical release dates
        env:
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
        run: python wti_release_bars.py
      - uses: actions/upload-artifact@v4
        with:
          name: wti-inventory-intraday
          path: |
            wti_eia_cl_5min.parquet
            wti_price_gaps.csv
          retention-days: 7
