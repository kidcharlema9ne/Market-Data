name: "Stocks price level on as-traded prices (split history from Yahoo): in-sample"
# research/trend_following_stocks/er_stocks_split_history.py then er_stocks_real_price_level.py (Michael, 18 Nov 2026). In-sample only (data through 2021-08-06); later years are never read.
on:
  push:
    branches: [claude/er-stocks-20261117]
    paths: ['.github/workflows/er-stocks-real-price-level.yml']
  workflow_dispatch:
concurrency:
  group: er-stocks-real-price-level-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy scipy scikit-learn yfinance
      - name: Download split history from Yahoo
        run: |
          D=research/trend_following_stocks/results_real_price_level
          mkdir -p $D
          python research/trend_following_stocks/er_stocks_split_history.py research/trend_following_stocks/results_signal_study/signal_rows.csv.gz $D | tee $D/split_history_output.txt
      - name: Save split history on the branch
        if: always()
        run: |
          D=research/trend_following_stocks/results_real_price_level
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $D
          git commit -m "Split history from Yahoo for every signal symbol (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
      - name: Fetch stock and SPY prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_stock_prices.py data_stocks
      - name: Run
        run: |
          D=research/trend_following_stocks/results_real_price_level
          python research/trend_following_stocks/er_stocks_real_price_level.py data_stocks/stock_prices.parquet $D data_stocks/spy_prices.parquet research/trend_following_stocks/results_signal_study/signal_rows.csv.gz $D/splits.csv $D/split_coverage.csv | tee $D/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          D=research/trend_following_stocks/results_real_price_level
          echo "workflow run ${{ github.run_id }}" > $D/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $D
          git commit -m "Stocks price level on as-traded prices: in-sample (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
