name: Export historical SPY and QQQ inputs
# research/spy_qqq_timing/band_grid.py (Michael, 19 Nov 2026). Sealed years already seen once; results labelled as such.
on:
  push:
    branches: [research/spy-qqq-full-allocation-20261119]
    paths: ['.github/workflows/export-spy-qqq-ohlc.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch SPY and QQQ from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_nasdaq_etf.py data_etf
      - name: Save the two ETF price histories
        run: |
          cd research/spy_qqq_timing
          python - <<'PY'
          import pandas as pd
          bars = pd.read_parquet('../../data_etf/nasdaq_etfs.parquet')
          bars['date'] = pd.to_datetime(bars.date_i, unit='D')
          bars.pivot(index='date', columns='symbol', values=['high','low','close']).to_csv('atr_prices.csv')
          PY
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add atr_prices.csv
          git commit -m 'Export historical inputs for standalone SPY QQQ research'
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD
