name: Export recent futures prices (for the COT price-gap report)
# Reads the newest 420 daily futures files from R2 and commits a small CSV (futures_data/recent_prices.csv) back to the branch it ran on.
on:
  workflow_dispatch:
  push:
    branches: ['claude/cot-price-gap-report-*']
    paths: ['.github/workflows/export-recent-prices.yml', 'futures_data/export_recent_prices.py']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas
      - name: Export recent prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/export_recent_prices.py 420
      - name: Commit the CSV to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add futures_data/recent_prices.csv
          git commit -m "Recent futures prices for the COT price-gap report" || echo "nothing to commit"
          git push
