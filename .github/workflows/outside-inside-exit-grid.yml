name: Outside day then inside day exit grid (in-sample 2008-2021, out-of-sample last 5 years)
on:
  # Push trigger removed 11 Nov 2026 so re-pushing the scripts cannot reopen the sealed out-of-sample years. Run by hand only.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Exit engine tests
        run: python research/outside_inside/test_exit_grid.py
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/cot_exit/fetch_futures_prices.py
      - name: Run the exit grid
        run: |
          mkdir -p research/outside_inside/results_exit_grid
          python research/outside_inside/exit_grid.py futures_prices.parquet research/cot_exit/cot_universe_report.csv research/outside_inside/results_exit_grid | tee research/outside_inside/results_exit_grid/run_output.txt
      - name: Save results on the branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/outside_inside/results_exit_grid
          git commit -m "Exit grid results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: outside_inside_exit_grid
          path: research/outside_inside/results_exit_grid
          retention-days: 14
