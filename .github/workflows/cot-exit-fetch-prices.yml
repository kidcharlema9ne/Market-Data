name: COT exit test - fetch futures prices (no returns; data copy only)
on:
  push:
    branches: [claude/cot-commercial50-exit-20261110]
    paths: [.github/workflows/cot-exit-fetch-prices.yml, research/cot_exit/fetch_futures_prices.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow
      - name: Fetch all futures daily files
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/cot_exit/fetch_futures_prices.py
      - uses: actions/upload-artifact@v4
        with:
          name: futures_prices
          path: futures_prices.parquet
          if-no-files-found: error
          retention-days: 7
