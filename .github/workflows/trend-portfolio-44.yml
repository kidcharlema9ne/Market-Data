name: Trend following - the 44-market portfolio at 0.25 percent per market (development years only)
# Same script and rule as Entry 100 (baseline_breakout.py, unchanged), run on the 44 markets of Entry 101 using full-size price histories.
# Sealed years (2021-11-08 on) are cut at load inside baseline_breakout.py.
on:
  workflow_dispatch:
  push:
    branches: ['claude/trend-universe-contract-size-20261112']
    paths:
      - 'research/trend_following/portfolio_44_list.csv'
      - '.github/workflows/trend-portfolio-44.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Baseline breakout on the 44 markets, development years only
        run: |
          mkdir -p research/trend_following/results_v5
          python research/trend_following/baseline_breakout.py futures_prices.parquet futures_data/trend_universe.csv research/trend_following/portfolio_44_list.csv research/trend_following/results_v5 300000 | tee research/trend_following/results_v5/baseline_output.txt
      - name: Save results on the branch
        run: |
          echo "workflow run ${{ github.run_id }}" > research/trend_following/results_v5/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following/results_v5
          git commit -m "44-market portfolio baseline results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
