name: Outside day then inside day trend filter (efficiency ratio), IN-SAMPLE ONLY
on:
  # Push trigger removed 11 Nov 2026: superseded by outside-inside-trail-stats.yml, which reruns this study (20-day) and adds the 10-day version.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Tests (efficiency ratio and sealed window)
        run: |
          python research/outside_inside/test_exit_grid.py
          python research/outside_inside/test_trend_filter.py
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Run the trend filter study
        run: |
          mkdir -p research/outside_inside/results_trend_filter
          python research/outside_inside/trend_filter.py futures_prices.parquet futures_data/report_universe_48_markets.csv research/outside_inside/results_trend_filter | tee research/outside_inside/results_trend_filter/run_output.txt
      - name: Save results on the branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/outside_inside/results_trend_filter
          git commit -m "Trend filter results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: outside_inside_trend_filter
          path: research/outside_inside/results_trend_filter
          retention-days: 14
