name: Outside day then inside day - 10-day efficiency ratio and 4 ATR trail portfolio statistics (IN-SAMPLE ONLY)
on:
  push:
    branches: [claude/outside-inside-day-20261111]
    paths: [.github/workflows/outside-inside-trail-stats.yml, research/outside_inside/trend_filter.py, research/outside_inside/trail_stats.py, research/outside_inside/test_trail_stats.py, research/outside_inside/test_trend_filter.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Tests
        run: |
          python research/outside_inside/test_exit_grid.py
          python research/outside_inside/test_trend_filter.py
          python research/outside_inside/test_trail_stats.py
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Rerun the 20-day trend filter (regression check) and run the 10-day version
        run: |
          mkdir -p research/outside_inside/results_trend_filter research/outside_inside/results_trend_filter_10day
          python research/outside_inside/trend_filter.py futures_prices.parquet futures_data/report_universe_48_markets.csv research/outside_inside/results_trend_filter 20 > /dev/null
          python research/outside_inside/trend_filter.py futures_prices.parquet futures_data/report_universe_48_markets.csv research/outside_inside/results_trend_filter_10day 10 | tee research/outside_inside/results_trend_filter_10day/run_output.txt
          git diff --stat -- research/outside_inside/results_trend_filter || true
      - name: Portfolio statistics for the 4 ATR trail
        run: |
          mkdir -p research/outside_inside/results_trail_stats
          python research/outside_inside/trail_stats.py futures_prices.parquet futures_data/report_universe_48_markets.csv research/outside_inside/results_trail_stats | tee research/outside_inside/results_trail_stats/run_output.txt
      - name: Save results on the branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/outside_inside/results_trend_filter research/outside_inside/results_trend_filter_10day research/outside_inside/results_trail_stats
          git commit -m "10-day trend filter and 4 ATR trail statistics (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: outside_inside_trail_stats
          path: |
            research/outside_inside/results_trend_filter_10day
            research/outside_inside/results_trail_stats
          retention-days: 14
