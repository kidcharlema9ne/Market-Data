name: "Efficiency ratio rule on stocks, under-$5 bad-data check: in-sample"
# research/trend_following_stocks/er_stocks_under5_check.py (Michael, 17 Nov 2026). In-sample only (data through 2021-08-06); later years are never read.
on:
  workflow_dispatch:
  push:
    branches: ['claude/er-stocks-20261117']
    paths:
      - 'research/trend_following_stocks/er_stocks_under5_check.py'
      - 'research/trend_following_stocks/confirmed_bad_under5.csv'
      - '.github/workflows/er-stocks-under5-check.yml'
concurrency:
  group: er-stocks-under5-check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch stock and SPY prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_stock_prices.py data_stocks
      - name: Under-$5 bad-data check
        run: |
          D=research/trend_following_stocks/results_under5_check
          mkdir -p $D
          EXTRA=""
          if [ -f research/trend_following_stocks/confirmed_bad_under5.csv ]; then EXTRA=research/trend_following_stocks/confirmed_bad_under5.csv; fi
          python research/trend_following_stocks/er_stocks_under5_check.py data_stocks/stock_prices.parquet $D data_stocks/spy_prices.parquet $EXTRA | tee $D/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          D=research/trend_following_stocks/results_under5_check
          echo "workflow run ${{ github.run_id }}" > $D/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $D
          git commit -m "Under-5 dollar bad-data check, in-sample (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
