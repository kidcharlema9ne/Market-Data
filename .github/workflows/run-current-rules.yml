name: Run current rules under three identity joins
on:
  workflow_dispatch:
  push:
    paths:
      - 'run_current_rules.py'
      - '.github/workflows/run-current-rules.yml'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow exchange-calendars
      - name: Rebuild four-buyer cohort and report results (read-only, prints to log)
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
        run: python -u run_current_rules.py
