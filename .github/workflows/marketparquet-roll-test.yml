name: MarketParquet roll table probe (read-only)
# Diagnostic only. Calls GET /api/v1/meta/futures_rolls and LISTS (never writes) the R2 futures_daily keys.
# Runs on a push to its own test branch (a manual dispatch needs the file on main). Results are committed back
# to the same test branch under research/roll_test/results/. Does not touch production workflows or R2 data.
on:
  push:
    branches: ['claude/marketparquet-roll-test-20261121']
    paths: ['research/roll_test/roll_table_probe.py', 'research/roll_test/overlap_probe.py', 'research/roll_test/free_symbol_probe.py', 'research/roll_test/seam_probe.py', 'research/roll_test/size_diff_probe.py', '.github/workflows/marketparquet-roll-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas
      - name: Probe roll table and archive freshness
        env:
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/roll_test/roll_table_probe.py 2>&1 | tee probe_log.txt
      - name: Overlap test (vendor current vs stored, read-only)
        continue-on-error: true
        env:
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/roll_test/overlap_probe.py 2>&1 | tee overlap_log.txt
      - name: Free per-symbol endpoint test (read-only)
        continue-on-error: true
        env:
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/roll_test/free_symbol_probe.py 2>&1 | tee free_log.txt
      - name: Seam check (read-only)
        continue-on-error: true
        env:
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/roll_test/seam_probe.py 2>&1 | tee seam_log.txt
      - name: Size diff, all years (read-only)
        continue-on-error: true
        env:
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/roll_test/size_diff_probe.py 2>&1 | tee size_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roll_probe
          path: |
            probe_log.txt
            overlap_log.txt
            free_log.txt
            seam_log.txt
            roll_probe_report.json
            futures_rolls.parquet
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit results to the test branch
        if: always() && github.ref_type == 'branch'
        run: |
          mkdir -p research/roll_test/results
          cp -f probe_log.txt overlap_log.txt free_log.txt seam_log.txt size_log.txt roll_probe_report.json futures_rolls.parquet research/roll_test/results/ 2>/dev/null || true
          git config user.name "roll-probe"
          git config user.email "roll-probe@users.noreply.github.com"
          git add research/roll_test/results
          git commit -m "Roll probe results (read-only run ${{ github.run_id }})" || echo "nothing to commit"
          git push origin "HEAD:${{ github.ref_name }}"
