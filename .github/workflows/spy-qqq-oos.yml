name: "SPY QQQ 200-day timing: in-sample reproduction and one look at the sealed years"
# research/spy_qqq_timing/spy_qqq_timing.py (Michael, 19 Nov 2026). Rules are frozen in the script header; one look at the sealed years (also saves equity curves; rerun after carrying the last Treasury bill rate into Nov 2026).
on:
  push:
    branches: [claude/spy-qqq-oos-20261119]
    paths: ['.github/workflows/spy-qqq-oos.yml']
  workflow_dispatch:
concurrency:
  group: spy-qqq-oos-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch SPY and QQQ from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_nasdaq_etf.py data_etf
      - name: Run
        run: |
          D=research/spy_qqq_timing/results
          mkdir -p $D
          python research/spy_qqq_timing/spy_qqq_timing.py data_etf/nasdaq_etfs.parquet $D research/spy_qqq_timing/tb3ms_monthly.csv | tee $D/output.txt
      - name: After-tax comparison (Michael, 19 Nov 2026)
        run: |
          D=research/spy_qqq_timing/results_tax
          mkdir -p $D
          python research/spy_qqq_timing/spy_qqq_tax.py data_etf/nasdaq_etfs.parquet $D research/spy_qqq_timing/tb3ms_monthly.csv | tee $D/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          D=research/spy_qqq_timing/results
          echo "workflow run ${{ github.run_id }}" > $D/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $D research/spy_qqq_timing/results_tax
          git commit -m "SPY QQQ 200-day timing: results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
