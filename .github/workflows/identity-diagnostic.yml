name: Identity conflict diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - 'diagnose_identity_conflicts.py'
      - '.github/workflows/identity-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow exchange-calendars
      - name: Classify ticker identity conflicts (read-only, prints to log)
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u diagnose_identity_conflicts.py
