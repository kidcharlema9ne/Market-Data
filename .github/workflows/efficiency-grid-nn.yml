name: Efficiency ratio grid (windows, thresholds, stops, trails) and neural network walk-forward (IN-SAMPLE ONLY)
on:
  push:
    branches: [claude/outside-inside-day-20261111]
    paths: [.github/workflows/efficiency-grid-nn.yml, research/efficiency_trend/grid_search.py, research/efficiency_trend/nn_walk_forward.py, research/efficiency_trend/test_grid_nn.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy scikit-learn
      - name: Tests
        run: |
          python research/outside_inside/test_exit_grid.py
          python research/outside_inside/test_trend_filter.py
          python research/outside_inside/test_trail_stats.py
          python research/efficiency_trend/test_efficiency_trend.py
          python research/efficiency_trend/test_grid_nn.py
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Grid search
        run: |
          mkdir -p research/efficiency_trend/results_grid
          python research/efficiency_trend/grid_search.py futures_prices.parquet futures_data/report_universe_48_markets.csv research/efficiency_trend/results_grid | tee research/efficiency_trend/results_grid/run_output.txt
      - name: Neural network walk-forward
        run: |
          mkdir -p research/efficiency_trend/results_nn
          python research/efficiency_trend/nn_walk_forward.py futures_prices.parquet futures_data/report_universe_48_markets.csv research/efficiency_trend/results_nn | tee research/efficiency_trend/results_nn/run_output.txt
      - name: Save results on the branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/efficiency_trend/results_grid research/efficiency_trend/results_nn
          git commit -m "Efficiency ratio grid and neural network walk-forward results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: efficiency_grid_nn
          path: |
            research/efficiency_trend/results_grid
            research/efficiency_trend/results_nn
          retention-days: 14
