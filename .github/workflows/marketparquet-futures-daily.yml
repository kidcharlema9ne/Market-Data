name: COT Wide Range Reversal with opposite-bar stop (read-only)
on:
  push:
    branches: [research/cot-futures-r2-audit]
    paths: [cot_wide_range_stop.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  price-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pandas numpy pyarrow
      - name: Calculate fixed-horizon outcomes from stored R2 files
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python cot_wide_range_stop.py
      - uses: actions/upload-artifact@v4
        with:
          name: cot-wide-range-stop-events
          path: cot-wide-range-stop-events.parquet
          retention-days: 7
