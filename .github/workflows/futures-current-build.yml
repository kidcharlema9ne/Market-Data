name: Build current futures series (Yahoo gap fill + vendor free days) into a separate R2 prefix
on:
  workflow_dispatch:
  push:
    branches: ['claude/futures-48-coverage-20261121']
    paths: ['futures_data/build_current_futures.py', 'futures_data/stitch_current_futures.py', '.github/workflows/futures-current-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow yfinance pandas
      - name: Build the current-days files
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u futures_data/build_current_futures.py
      - name: Stitch archive plus current days into one table (rebased with the vendor roll file)
        env:
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u futures_data/stitch_current_futures.py
      - uses: actions/upload-artifact@v4
        with:
          name: futures_prices_current
          path: futures_prices_current.parquet
          retention-days: 7
      - name: Commit the report to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git pull -q --rebase origin "$GITHUB_REF_NAME" || true
          git add futures_data/current_build_report.md futures_data/current_stitch_report.md
          git commit -m "Current-futures build report" || echo "nothing to commit"
          git push
