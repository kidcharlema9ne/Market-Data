name: Free-year research smoke test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3 pyarrow
      - name: Reproduce four archived Form 4 cases from R2 prices
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python -u test_research_batch.py . --r2
          python -u research_pilot.py february_review_queue.json february-pilot.json --r2
      - uses: actions/upload-artifact@v4
        with:
          name: february-pilot-coverage
          path: february-pilot.json
