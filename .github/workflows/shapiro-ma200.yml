name: COT 200-day trend snapshots
on:
  push:
    branches: [research/cot-futures-r2-audit]
    paths: [.github/workflows/shapiro-ma200.yml]
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pandas numpy pyarrow
      - name: Calculate prior-session trends from existing R2 bars
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from datetime import date
          import os
          import boto3
          import numpy as np
          import pandas as pd
          from botocore.config import Config
          import cot_futures_price_panel as p

          p.ROOTS.update({"OJ","LBS","PA","BTC","ETH","MET","ZO"})
          storage=boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto",
              config=Config(max_pool_connections=32,retries={"max_attempts":8,"mode":"standard"}))
          pages=storage.get_paginator("list_objects_v2").paginate(Bucket=p.BUCKET,Prefix=p.PREFIX)
          keys=sorted(x["Key"] for page in pages for x in page.get("Contents",[]) if x["Key"].endswith(".parquet")
              and date.fromisoformat(x["Key"][len(p.PREFIX):-8])<=date(2026,11,6))
          with ThreadPoolExecutor(max_workers=24) as pool:
              bars=pd.concat(pool.map(lambda key:p.read_file(storage,key),keys),ignore_index=True)
          snapshots=[]
          for _, g in bars.groupby("symbol"):
              g=g.sort_values("session").reset_index(drop=True)
              o,h,l,c=(g[x].to_numpy() for x in ("open","high","low","close"))
              bad=~np.isfinite([o,h,l,c]).all(axis=0)|(h<np.maximum(o,c))|(l>np.minimum(o,c))
              bad|=g.session.duplicated(keep=False).to_numpy()|~g.date_offset.between(0,3).to_numpy()
              gaps=g.session.diff().dt.days.fillna(0).gt(7)
              close=g.close.mask(bad)
              average=close.rolling(200).mean().where(~gaps.rolling(199).max().fillna(1).astype(bool))
              q=g[["symbol","session"]].copy()
              q["prior_close"]=close.shift(1)
              q["ma200"]=average.shift(1)
              q["entry_open"]=g.open.mask(bad)
              q["prior_session"]=g.session.shift(1)
              snapshots.append(q[~g.session.duplicated(keep=False)])
          result=pd.concat(snapshots,ignore_index=True)
          assert not result.duplicated(["symbol","session"]).any()
          assert (result.prior_session.dropna()<result.loc[result.prior_session.notna(),"session"]).all()
          result.to_parquet("shapiro-ma200.parquet",index=False)
          print(len(keys),len(result),result.symbol.nunique())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shapiro-ma200
          path: shapiro-ma200.parquet
          retention-days: 7
