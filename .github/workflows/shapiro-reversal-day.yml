name: Shapiro daily reversal outcomes
on:
  push:
    branches: [research/cot-futures-r2-audit]
    paths: [.github/workflows/shapiro-reversal-day.yml, shapiro_reversal_day.py]
permissions:
  contents: read
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pandas numpy pyarrow
      - name: Read archived daily futures bars
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python shapiro_reversal_day.py
      - uses: actions/upload-artifact@v4
        with:
          name: shapiro-reversal-day-events
          path: shapiro-reversal-day-events.parquet
          retention-days: 7
