name: SPY QQQ verified close
on:
  workflow_dispatch:
    inputs:
      check:
        type: choice
        options: [daily, weekly, test]
        default: daily
permissions:
  contents: write
  issues: write
concurrency:
  group: spy-qqq-close
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas<3' requests lxml 'exchange-calendars>=4.11,<5'
      - run: python spy_qqq_live/check.py
        env:
          CHECK_MODE: ${{ inputs.check }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          GH_TOKEN: ${{ github.token }}
          SPYQQQ_GMAIL_ADDRESS: ${{ secrets.SPYQQQ_GMAIL_ADDRESS }}
          SPYQQQ_GMAIL_APP_PASSWORD: ${{ secrets.SPYQQQ_GMAIL_APP_PASSWORD }}
          SPYQQQ_EMAIL_TO: ${{ secrets.SPYQQQ_EMAIL_TO }}
      - name: Save verified signals and outstanding deliveries
        if: always()
        run: |
          git config user.name 'SPY QQQ monitor'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add spy_qqq_live/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record SPY QQQ close check'
            git pull --rebase
            git push
          fi
