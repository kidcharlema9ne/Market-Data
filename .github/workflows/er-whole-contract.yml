name: Whole-contract portfolio on $300k and buy-limit entries, development years only
# er_whole_contract_limit.py. Sealed years (after 2021-08-06) are cut at load inside the script.
on:
  workflow_dispatch:
  push:
    branches: ['claude/er-window-mae-mfe-20261116']
    paths:
      - 'research/trend_following/er_whole_contract_limit.py'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Window and threshold test
        run: |
          mkdir -p research/trend_following/results_whole_contract
          python research/trend_following/er_whole_contract_limit.py futures_prices.parquet futures_data/report_universe_48_markets.csv research/trend_following/results_whole_contract | tee research/trend_following/results_whole_contract/output.txt
      - name: Save results on the branch
        run: |
          echo "workflow run ${{ github.run_id }}" > research/trend_following/results_whole_contract/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following/results_whole_contract
          git commit -m "Whole-contract and limit-entry results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
