name: SPY QQQ Gmail and Pushover delivery
on:
  workflow_dispatch:
  schedule:
    - cron: '20,25,40,50 16 * * 1-5'
      timezone: America/New_York
    - cron: '10,40 17-20 * * 1-5'
      timezone: America/New_York
permissions:
  contents: write
concurrency:
  group: spy-qqq-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read the SPY/QQQ notification queue
        uses: actions/checkout@v4
        with:
          repository: kidcharlema9ne/SPY-QQQ-System
          ref: main
          ssh-key: ${{ secrets.SPYQQQ_SYSTEM_READ_KEY }}
          persist-credentials: false
          path: .spy-qqq-system
          sparse-checkout: /spy_qqq_live/state.json
          sparse-checkout-cone-mode: false
      - run: python -m pip install requests
      - run: python spy_qqq_live/deliver.py
        env:
          SYSTEM_STATE: .spy-qqq-system/spy_qqq_live/state.json
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          SPYQQQ_GMAIL_ADDRESS: ${{ secrets.SPYQQQ_GMAIL_ADDRESS }}
          SPYQQQ_GMAIL_APP_PASSWORD: ${{ secrets.SPYQQQ_GMAIL_APP_PASSWORD }}
          SPYQQQ_EMAIL_TO: ${{ secrets.SPYQQQ_EMAIL_TO }}
      - name: Save delivery receipts
        if: always()
        run: |
          if [ -f spy_qqq_live/delivery_receipts.json ]; then
            git config user.name 'SPY QQQ delivery'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add spy_qqq_live/delivery_receipts.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record accepted SPY QQQ notifications'
              git pull --rebase
              git push
            fi
          fi
