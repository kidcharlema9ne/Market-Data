name: Check 48-market futures coverage in R2 (reads only; commits a one-page report to this branch)
on:
  workflow_dispatch:
  push:
    branches: ['claude/futures-48-coverage-20261121']
    paths: ['futures_data/check_48_coverage.py', '.github/workflows/futures-48-coverage.yml']
permissions:
  contents: write
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow
      - name: Check coverage
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u futures_data/check_48_coverage.py | tee coverage.log
      - name: Commit the report to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add futures_data/coverage_48_report.md
          git commit -m "Coverage report for the 48 COT-report markets" || echo "nothing to commit"
          git push
