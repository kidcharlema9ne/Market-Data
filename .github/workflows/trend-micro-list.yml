name: Trend following - micro-first list, summed percent volatility, ETF stand-ins
# Reads only the latest sessions of futures, and the latest ~45 sessions of a handful of ETFs. Runs by hand, or on a push to this branch.
on:
  workflow_dispatch:
  push:
    branches: ['claude/trend-universe-contract-size-20261112']
    paths:
      - 'futures_data/trend_universe.csv'
      - 'research/trend_following/micro_list.py'
      - 'research/trend_following/fetch_etf_recent.py'
      - 'research/trend_following/contract_size_atr20.py'
      - '.github/workflows/trend-micro-list.yml'
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch futures prices and recent ETF prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python futures_data/fetch_futures_prices.py
          python research/trend_following/fetch_etf_recent.py etf_recent.parquet DIA EWN EWJ DXJ BNO UGA CPER JO
      - name: Contract sizes, micro-first list, ETF stand-ins
        run: |
          mkdir -p research/trend_following/results_v2
          python research/trend_following/contract_size_atr20.py futures_prices.parquet futures_data/trend_universe.csv research/trend_following/results_v2 300000 > research/trend_following/results_v2/contract_size_output.txt
          python research/trend_following/micro_list.py research/trend_following/results_v2/contract_size_atr20.csv futures_data/trend_universe.csv etf_recent.parquet research/trend_following/results_v2 300000 | tee research/trend_following/results_v2/micro_list_output.txt
      - name: Save results on the branch
        run: |
          echo "workflow run ${{ github.run_id }}" > research/trend_following/results_v2/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following/results_v2
          git commit -m "Micro-first list results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
