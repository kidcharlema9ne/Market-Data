name: COT WR4 rolling trailing-stop sweep
on:
  push:
    branches: [research/wr4-trailing-20261115]
    paths:
      - research/wr4_inside/trailing.py
      - .github/workflows/wr4-trailing.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy tabulate
      - name: Trailing execution tests
        run: python research/wr4_inside/trailing.py --selftest
      - name: Fetch verified daily prices
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Reproduce baseline then run trailing grid and controls
        run: |
          set -o pipefail
          mkdir -p research/wr4_inside/trailing_results
          python -u research/wr4_inside/trailing.py | tee research/wr4_inside/trailing_results/run_output.txt
      - name: Save results and checkpoint
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with Path('docs/SHARED_LOG.md').open('a') as f:
              f.write('\n\n## 15 Nov 2026 | ChatGPT | Rolling trailing stops on COT WR4 | PROVISIONAL\nScript research/wr4_inside/trailing.py; branch research/wr4-trailing-20261115. Run https://github.com/kidcharlema9ne/insider-buying-research/actions/runs/'+os.environ['GITHUB_RUN_ID']+'. Eight trailing windows (2/3/5/7/10/14/21/42 sessions), ratcheting prior-completed lows/highs with original initial stop, 252-session cap. Full baseline and frozen stochastic42 10/90 subset, common eligible cohort; original 275 trades reproduced first. Fixed21/42 benchmarks, 10,000 matched random-entry draws, grid correction, block confidence and cross-era selection. Development years only; inherited price/timing approximations retained. Report and CSVs: research/wr4_inside/trailing_results/. Existing COT report unchanged.\n')
          PY
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/wr4_inside/trailing_results docs/SHARED_LOG.md
          git commit -m "Record trailing-stop sweep, run ${{ github.run_id }}"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wr4_trailing_results
          path: research/wr4_inside/trailing_results
          retention-days: 30
