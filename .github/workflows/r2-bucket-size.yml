name: R2 bucket size - read-only inventory of the insider-research bucket by folder
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/canonical/r2_bucket_size.py'
      - '.github/workflows/r2-bucket-size.yml'
permissions:
  contents: read
jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - name: List objects and total sizes (read-only)
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONPATH: .
        run: python -u research/canonical/r2_bucket_size.py
