name: "Efficiency ratio rule on stocks, combined 20-day and 60-day tests: in-sample"
# research/trend_following_stocks/er_stocks_combined_er.py (Michael, 17 Nov 2026). In-sample only (data through 2021-08-06); later years are never read.
on:
  workflow_dispatch:
  push:
    branches: ['claude/er-stocks-20261117']
    paths:
      - 'research/trend_following_stocks/er_stocks_combined_er.py'
      - '.github/workflows/er-stocks-combined-er.yml'
concurrency:
  group: er-stocks-combined-er
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - pull: "1.5"
            tag: "p15"
          - pull: "2.5"
            tag: "p25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch stock and SPY prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_stock_prices.py data_stocks
      - name: Pullback ${{ matrix.pull }} ATR
        run: |
          mkdir -p research/trend_following_stocks/results_combined_er_${{ matrix.tag }}
          python research/trend_following_stocks/er_stocks_combined_er.py data_stocks/stock_prices.parquet research/trend_following_stocks/results_combined_er_${{ matrix.tag }} data_stocks/spy_prices.parquet ${{ matrix.pull }} | tee research/trend_following_stocks/results_combined_er_${{ matrix.tag }}/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          echo "workflow run ${{ github.run_id }} pullback ${{ matrix.pull }}" > research/trend_following_stocks/results_combined_er_${{ matrix.tag }}/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following_stocks/results_combined_er_${{ matrix.tag }}
          git commit -m "Combined efficiency ratio tests ${{ matrix.tag }}, in-sample results_combined_er_${{ matrix.tag }} (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
