name: "ETF portfolio on 200-day averages with a 4% band: SPY QQQ VEA VWO IAU BIV"
# research/trend_etf_portfolio/etf_portfolio_timing.py (Michael, 19 Nov 2026). Price only, annual rebalance, Treasury bills when out.
on:
  push:
    branches: [claude/trend-etf-portfolio-20261119]
    paths: ['.github/workflows/trend-etf-portfolio.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'insample (default, sealed years cut off before any calculation) or sealed (run once, after allocations are frozen)'
        default: 'insample'
concurrency:
  group: trend-etf-portfolio-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch the funds from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_etf_portfolio/fetch_portfolio_etfs.py data_etf
      - name: Run
        run: |
          M=${{ github.event.inputs.mode || 'insample' }}
          D=research/trend_etf_portfolio/results_$M
          mkdir -p $D
          python research/trend_etf_portfolio/etf_portfolio_timing.py data_etf/portfolio_etfs.parquet $D research/spy_qqq_timing/tb3ms_monthly.csv $M | tee $D/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          M=${{ github.event.inputs.mode || 'insample' }}
          D=research/trend_etf_portfolio/results_$M
          echo "workflow run ${{ github.run_id }}" > $D/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $D
          git commit -m "ETF portfolio 200-day timing: results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
