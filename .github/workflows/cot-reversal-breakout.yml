name: COT reversal-day breakout MAE/MFE backtest (48-market COT universe, development period)
# Rules are declared in research/cot_reversal/SPEC.md and the script docstring, committed BEFORE this run.
# Default = development period only (sealed last 5 years untouched). Set unseal=true by hand only when Michael says so.
on:
  push:
    branches: [claude/cot-reversal-breakout-20261116]
    paths: [.github/workflows/cot-reversal-breakout.yml, research/cot_reversal/*.py, research/cot_reversal/cot_weekly_full.csv.gz, research/cot_reversal/cot_universe_report.csv]
  workflow_dispatch:
    inputs:
      unseal:
        description: 'Include the sealed last five years (only when Michael says so)'
        default: 'false'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Self-test of the trade mechanics
        run: python research/cot_reversal/cot_reversal_breakout.py selftest
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Run the backtest
        run: |
          OUT=research/cot_reversal/results_dev
          FLAG=""
          if [ "${{ github.event.inputs.unseal }}" = "true" ]; then OUT=research/cot_reversal/results_full; FLAG="--unseal"; fi
          mkdir -p $OUT
          python research/cot_reversal/cot_reversal_breakout.py run research/cot_reversal/cot_weekly_full.csv.gz research/cot_reversal/cot_universe_report.csv futures_prices.parquet $OUT $FLAG | tee $OUT/run_output.txt
          echo "OUT=$OUT" >> $GITHUB_ENV
      - name: Independent verification of a random sample of trades
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.unseal }}" = "true" ]; then FLAG="--unseal"; fi
          python research/cot_reversal/cot_reversal_breakout.py verify research/cot_reversal/cot_weekly_full.csv.gz research/cot_reversal/cot_universe_report.csv futures_prices.parquet $OUT $FLAG | tee $OUT/verification_output.txt
      - name: Save results on the branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $OUT
          git commit -m "COT reversal breakout results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: cot_reversal_results
          path: ${{ env.OUT }}
          retention-days: 14
