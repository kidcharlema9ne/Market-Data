name: "Inspect stock archive labels (read-only, no returns)"
on:
  workflow_dispatch:
  push:
    branches: ['claude/er-stocks-20261117']
    paths:
      - 'research/trend_following_stocks/inspect_stock_symbols.py'
      - '.github/workflows/inspect-stock-symbols.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Inspect
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p research/trend_following_stocks/diagnostics
          python research/trend_following_stocks/inspect_stock_symbols.py research/trend_following_stocks/diagnostics/symbol_labels.txt
      - name: Save on the branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following_stocks/diagnostics
          git commit -m "Stock archive label inspection (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
