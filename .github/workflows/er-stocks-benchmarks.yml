name: "Stock system vs SPY and QQQ (buy and hold, 200-day trend): in-sample"
# research/trend_following_stocks/er_stocks_benchmarks.py (Michael, 18 Nov 2026). In-sample only (through 2021-08-06).
on:
  push:
    branches: [claude/er-stocks-20261117]
    paths: ['.github/workflows/er-stocks-benchmarks.yml']
  workflow_dispatch:
concurrency:
  group: er-stocks-benchmarks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy matplotlib
      - name: Fetch prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python research/trend_following_stocks/fetch_stock_prices.py data_stocks
          python research/trend_following_stocks/fetch_nasdaq_etf.py data_stocks
      - name: Compare
        run: |
          D=research/trend_following_stocks/results_benchmarks
          mkdir -p $D
          python research/trend_following_stocks/er_stocks_benchmarks.py x data_stocks/spy_prices.parquet data_stocks/nasdaq_etfs.parquet $D research/trend_following_stocks/results_equity/equity_daily.csv | tee $D/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          D=research/trend_following_stocks/results_benchmarks
          echo "workflow run ${{ github.run_id }}" > $D/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $D
          git commit -m "Stock system vs SPY and QQQ (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
