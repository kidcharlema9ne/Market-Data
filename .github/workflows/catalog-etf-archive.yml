name: Catalog ETF research for migration
on:
  push:
    branches: [research/spy-qqq-full-allocation-20261119]
    paths: ['.github/workflows/catalog-etf-archive.yml']
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory relevant files across branch tips
        run: |
          python - <<'PY'
          import subprocess as sp,json,re
          def git(*args):
              return sp.check_output(['git',*args],text=True)
          refs=git('for-each-ref','--sort=-committerdate','--format=%(objectname) %(refname:short)','refs/remotes/origin').splitlines()
          seen=set()
          rows=[]
          for ref in refs:
              sha,branch=ref.split(' ',1)
              for line in git('ls-tree','-r',sha).splitlines():
                  meta,path=line.split('\t',1)
                  if not (re.search(r'spy[_-]qqq|trend[_-]etf|nasdaq[_-]etf|etf[_-]portfolio|matched[_-]risk',path,re.I) or path=='docs/SHARED_LOG.md' and re.search('spy-qqq|trend-etf',branch)): continue
                  blob=meta.split()[-1]
                  if (blob,path) in seen: continue
                  seen.add((blob,path))
                  rows.append([path,sha,blob,branch])
          open('etf_migration_catalog.json','w').write(json.dumps(rows))
          PY
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add etf_migration_catalog.json
          git commit -m 'Catalog ETF research snapshots for migration'
          git push origin HEAD
