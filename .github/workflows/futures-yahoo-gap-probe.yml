name: Probe free Yahoo futures for the 11-09..11-13 gap (read-only, commits a report to this branch)
on:
  workflow_dispatch:
  push:
    branches: ['claude/futures-48-coverage-20261121']
    paths: ['futures_data/yahoo_gap_probe.py', '.github/workflows/futures-yahoo-gap-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow yfinance pandas
      - name: Probe
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u futures_data/yahoo_gap_probe.py
      - name: Commit the report to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git pull -q --rebase origin "$GITHUB_REF_NAME" || true
          git add futures_data/yahoo_gap_report.md futures_data/yahoo_gap_candidates.csv
          git commit -m "Yahoo gap probe report" || echo "nothing to commit"
          git push
