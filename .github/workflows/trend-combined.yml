name: "Stock and futures trend systems run together: in-sample overlap 2008 to Aug 2021"
# research/trend_combined/futures_daily_export.py then combine_stocks_futures.py (Michael, 19 Nov 2026). Stock sealed years are never read (stock series ends 2021-08-06; futures cut to the same date).
on:
  push:
    branches: [claude/combine-stocks-futures-20261119]
    paths: ['.github/workflows/trend-combined.yml', 'research/trend_combined/**']
  workflow_dispatch:
concurrency:
  group: trend-combined-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Futures daily profit series
        run: |
          D=research/trend_combined/results
          mkdir -p $D
          python research/trend_combined/futures_daily_export.py futures_prices.parquet futures_data/report_universe_48_markets.csv $D | tee $D/export_output.txt
      - name: Combine with the stock system
        run: |
          D=research/trend_combined/results
          python research/trend_combined/combine_stocks_futures.py research/trend_following_stocks/results_equity/equity_daily.csv $D/futures_daily_pnl.csv $D | tee $D/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          D=research/trend_combined/results
          echo "workflow run ${{ github.run_id }}" > $D/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $D
          git commit -m "Stock and futures systems combined, in-sample overlap (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
