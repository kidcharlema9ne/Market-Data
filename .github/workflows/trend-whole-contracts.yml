name: Trend following - whole contracts and ETF stand-ins (budget for a 100,000 drawdown, ETF cash check)
# trend_whole_contracts.py: the system in whole contracts (micro first) with ETF stand-ins, instead of fractional contracts. Development years only.
on:
  workflow_dispatch:
  push:
    branches: ['claude/trend-exit-tests-20261112']
    paths:
      - 'research/trend_following/trend_whole_contracts.py'
      - '.github/workflows/trend-whole-contracts.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Whole contracts
        run: |
          mkdir -p research/trend_following/results_whole_contracts
          python research/trend_following/trend_whole_contracts.py futures_prices.parquet futures_data/trend_universe.csv research/trend_following/portfolio_51_list.csv research/trend_following/results_whole_contracts research/trend_following/results_v2/contract_size_atr20.csv | tee research/trend_following/results_whole_contracts/whole_contracts_output.txt
      - name: Save results on the branch
        run: |
          echo "workflow run ${{ github.run_id }}" > research/trend_following/results_whole_contracts/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following/results_whole_contracts
          git commit -m "Whole contracts (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
