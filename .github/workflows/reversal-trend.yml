name: Failed reversal with the trend (no COT filter, 48 markets, development period)
# Rules are declared as C51 in docs/CANDIDATES.md and in the script docstring, committed BEFORE this run.
# Development period only (sealed last 5 years untouched).
on:
  push:
    branches: [claude/cot-reversal-trend-20261116]
    paths: [.github/workflows/reversal-trend.yml, research/reversal_trend/*.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Self-tests (inherited trade mechanics and the new trend features)
        run: |
          python research/cot_reversal/cot_reversal_breakout.py selftest
          python research/reversal_trend/reversal_trend.py selftest
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - name: Run the backtest
        run: |
          OUT=research/reversal_trend/results_dev
          mkdir -p $OUT
          python research/reversal_trend/reversal_trend.py run research/cot_reversal/cot_universe_report.csv futures_prices.parquet $OUT | tee $OUT/run_output.txt
          echo "OUT=$OUT" >> $GITHUB_ENV
      - name: Save results on the branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $OUT
          git commit -m "Reversal with the trend results (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: reversal_trend_results
          path: ${{ env.OUT }}
          retention-days: 14
