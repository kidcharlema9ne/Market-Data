name: "Stocks: SPY 200-day condition with a buffer above or below, volume-surge baseline: in-sample"
# research/trend_following_stocks/er_stocks_spy_buffer.py (Michael, 18 Nov 2026). In-sample only (data through 2021-08-06); later years are never read.
on:
  push:
    branches: [claude/er-stocks-20261117]
    paths: ['.github/workflows/er-stocks-spy-buffer.yml']
  workflow_dispatch:
concurrency:
  group: er-stocks-spy-buffer-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch stock and SPY prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_stock_prices.py data_stocks
      - name: Run
        run: |
          D=research/trend_following_stocks/results_spy_buffer
          mkdir -p $D
          python research/trend_following_stocks/er_stocks_spy_buffer.py data_stocks/stock_prices.parquet $D data_stocks/spy_prices.parquet  | tee $D/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          D=research/trend_following_stocks/results_spy_buffer
          echo "workflow run ${{ github.run_id }}" > $D/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add $D
          git commit -m "Stocks SPY buffer around the 200-day: in-sample (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
