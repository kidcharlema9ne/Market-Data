name: Fetch Michael's futures prices (reusable)
# Stitches every marketparquet/futures_daily/{date}.parquet in R2 into one table and uploads it as the artifact "futures_prices".
# Run by hand, or call from another workflow in this repo:  uses: ./.github/workflows/futures-prices.yml  with  secrets: inherit
# then download the artifact "futures_prices" (file futures_prices.parquet). See FUTURES_DATA.md.
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow
      - name: Fetch futures prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python futures_data/fetch_futures_prices.py
      - uses: actions/upload-artifact@v4
        with:
          name: futures_prices
          path: futures_prices.parquet
          if-no-files-found: error
          retention-days: 7
