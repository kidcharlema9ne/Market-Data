name: Probe newer MarketParquet futures days (read-only, commits a report to this branch)
on:
  workflow_dispatch:
  push:
    branches: ['claude/futures-48-coverage-20261121']
    paths: ['futures_data/probe_fresh_futures.py', '.github/workflows/futures-fresh-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow
      - name: Probe
        env:
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u futures_data/probe_fresh_futures.py
      - name: Commit the report to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git pull -q --rebase origin "$GITHUB_REF_NAME" || true
          git add futures_data/fresh_probe_report.md
          git commit -m "Probe report: newer futures days and overlap ratios" || echo "nothing to commit"
          git push
