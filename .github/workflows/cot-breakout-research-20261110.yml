name: COT breakout historical daily archive
on:
  push:
    branches:
      - research/cot-extreme-breakout-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow
      - name: Read verified R2 daily objects
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PYTHON'
          import csv
          import gzip
          from concurrent.futures import ThreadPoolExecutor
          import hashlib
          import json
          from contextlib import closing
          from io import BytesIO
          from pathlib import Path

          import pyarrow.parquet as pq
          from r2_storage import BUCKET, client

          storage = client()
          prefix = "marketparquet/futures_daily/"
          pages = storage.get_paginator("list_objects_v2")
          def keys(prefix):
              return sorted(o["Key"] for p in pages.paginate(Bucket=BUCKET, Prefix=prefix) for o in p.get("Contents", []))
          inventory = [key for key in keys(prefix) if key.endswith(".parquet")]
          sessions = [key[len(prefix):-8] for key in inventory]
          audit = {
              "count": len(sessions), "first": sessions[0], "last": sessions[-1],
              "sessions": sessions, "schemas": {},
              "roll_metadata": [key for key in keys("marketparquet/") if "roll" in key or "contract_calendar" in key],
          }
          fields = ["session", "embedded", "symbol", "asset_type", "open", "high", "low", "close", "volume"]
          roots = set("6Z A6 AD AIGCI ALI B6 BR BTC BZ CB CC CL CT DJUSRE DX E1 E6 EMD ES ESTR ETH GC GF HE HG HH HO HRC IQB J1 KC KE LBS LE M2K MBT MES MET MFS MGC MME MNQ MP MYM N6 NG NIY NQ OJ PA PL RB RP RSV RTY RY SB SI SOL SPXDIVAN SR1 SR3 TN UB US VX XRP YM ZC ZF ZL ZM ZN ZQ ZR ZS ZT ZW".split())
          def extract(pair):
              session, key = pair
              obj = storage.get_object(Bucket=BUCKET, Key=key)
              with closing(obj["Body"]) as body:
                  raw = body.read()
              if obj["Metadata"].get("verified-sha256") != hashlib.sha256(raw).hexdigest():
                  raise RuntimeError("Missing or mismatched verified SHA-256 for " + session)
              parquet = pq.ParquetFile(BytesIO(raw))
              date_field = "date" if "date" in parquet.schema_arrow.names else "timestamp"
              records = parquet.read(columns=[date_field, *fields[2:]]).to_pylist()
              return [dict(row, session=session, embedded=row.pop(date_field)) for row in records if row["symbol"] in roots]
          with gzip.open("historical-futures-daily.csv.gz", "wt", newline="") as output:
              writer = csv.DictWriter(output, fieldnames=fields)
              writer.writeheader()
              with ThreadPoolExecutor(max_workers=20) as pool:
                  for rows in pool.map(extract, zip(sessions, inventory)):
                      writer.writerows(rows)
          Path("futures-archive-audit.json").write_text(json.dumps(audit))
          print({key: audit[key] for key in ("count", "first", "last", "roll_metadata")})
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: cot-breakout-historical-20261110
          path: |
            historical-futures-daily.csv.gz
            futures-archive-audit.json
          retention-days: 3
