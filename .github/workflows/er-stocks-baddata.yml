name: "Efficiency ratio rule on stocks, Bad-data check: in-sample"
# research/trend_following_stocks/er_stocks_baddata.py (Michael, 17 Nov 2026). In-sample only (data through 2021-08-06); later years are never read.
on:
  workflow_dispatch:
  push:
    branches: ['claude/er-stocks-20261117']
    paths:
      - 'research/trend_following_stocks/er_stocks_baddata.py'
      - '.github/workflows/er-stocks-baddata.yml'
concurrency:
  group: er-stocks-baddata
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pyarrow pandas numpy
      - name: Fetch stock and SPY prices from R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/trend_following_stocks/fetch_stock_prices.py data_stocks
      - name: Bad-data check
        run: |
          mkdir -p research/trend_following_stocks/results_baddata
          python research/trend_following_stocks/er_stocks_baddata.py data_stocks/stock_prices.parquet research/trend_following_stocks/results_baddata data_stocks/spy_prices.parquet | tee research/trend_following_stocks/results_baddata/output.txt
      - name: Save results on the branch
        if: always()
        run: |
          echo "workflow run ${{ github.run_id }}" > research/trend_following_stocks/results_baddata/RUN_ID.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/trend_following_stocks/results_baddata
          git commit -m "Bad-data check, in-sample results_baddata (workflow run ${{ github.run_id }})" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 15; done
